# Minimal deployment: one container, everything in memory, no database, no Redis.
#
#   cp .env.example .env     # set PANEL_PASSWORD and FLICKSYNC_PUBLIC_URL
#   docker compose up -d --build
#   docker compose exec flick-modules flicksync invite   # the one-link invitation for Flick
services:
  flick-modules:
    build:
      context: .
      target: flicksync
    image: flicksync:latest
    restart: unless-stopped
    env_file:
      - .env
    # Reachable by the reverse proxy / other containers; publish a host port yourself if you need one.
    expose:
      - "${FLICKSYNC_PORT:-8787}"
    volumes:
      # Holds the auto-generated signing key and settings.json (panel-managed settings), the only
      # files the service ever writes.
      - flicksync-data:/data
    # Hardening (read-only root filesystem, no privileges).
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Allow sockets to drain on SIGTERM (FLICKSYNC_SHUTDOWN_GRACE defaults to 10s).
    stop_grace_period: 15s

  # Web panel (Next.js), on by default on port 3000 inside the compose network. It needs
  # PANEL_PASSWORD (10+ characters) and exits with a clear message without it; ENABLE_WEB_PANEL=false
  # turns it off.
  panel:
    build:
      context: .
      target: panel
    image: flick-panel:latest
    restart: on-failure:5
    env_file:
      - .env
    environment:
      FLICKSYNC_URL: http://flick-modules:8787
      # On by default; ENABLE_WEB_PANEL=false in .env turns it off. Needs PANEL_PASSWORD.
      ENABLE_WEB_PANEL: ${ENABLE_WEB_PANEL:-true}
    depends_on:
      - flick-modules
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  flicksync-data:
