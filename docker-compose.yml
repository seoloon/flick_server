# Minimal deployment: one container, everything in memory, no database, no Redis.
#
#   cp .env.example .env     # set FLICKSYNC_PUBLIC_URL (https://your.domain)
#   docker compose up -d --build
#   docker compose exec flicksync flicksync invite   # the one-link invitation for Flick
services:
  flicksync:
    build:
      context: .
      target: flicksync
    image: flicksync:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FLICKSYNC_PORT:-8787}:${FLICKSYNC_PORT:-8787}"
    volumes:
      # Holds the auto-generated signing key (the only thing the service ever writes).
      - flicksync-data:/data
    # Hardening (read-only root filesystem, no privileges).
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Allow sockets to drain on SIGTERM (FLICKSYNC_SHUTDOWN_GRACE defaults to 10s).
    stop_grace_period: 15s

  # Optional web panel (Next.js). ENABLE_WEB_PANEL=false (the default) makes the container exit
  # right away and publish nothing; ENABLE_WEB_PANEL=true serves it on PANEL_PORT (default 3000).
  panel:
    build:
      context: .
      target: panel
    image: flick-panel:latest
    restart: on-failure
    env_file:
      - .env
    environment:
      FLICKSYNC_URL: http://flicksync:8787
    depends_on:
      - flicksync
    ports:
      - "${PANEL_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  flicksync-data:
