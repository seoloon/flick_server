[package]
name = "flicksync"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Real-time watch-together synchronization service for Flick"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.22"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
qrcode = { version = "0.14", default-features = false }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
tower = "0.5.3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
