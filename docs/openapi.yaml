openapi: 3.0.3
info:
  title: FlickSync HTTP API
  version: 0.1.0
  description: |
    REST surface of FlickSync. Playback, presence and chat are carried by the WebSocket
    protocol described in `protocol.md` (the upgrade endpoint is listed below for completeness).
    All room endpoints require `Authorization: Bearer <token>` (a JWT issued by the Flick Server).
servers:
  - url: http://localhost:8787
tags:
  - name: ops
  - name: rooms
  - name: downloads
paths:
  /health:
    get:
      tags: [ops]
      summary: Liveness
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: ok }, version: { type: string } } }
  /ready:
    get:
      tags: [ops]
      summary: Readiness (accepting work and able to verify tokens)
      responses:
        "200": { description: Ready }
        "503": { description: Shutting down or no signing keys configured }
  /metrics:
    get:
      tags: [ops]
      summary: Prometheus metrics (404 unless FLICKSYNC_METRICS_ENABLED=true)
      security: [{ metricsToken: [] }, {}]
      responses:
        "200": { description: Prometheus text format, content: { text/plain: { schema: { type: string } } } }
        "401": { description: Metrics token required or wrong }
        "404": { description: Metrics disabled }
  /api/v1/rooms:
    post:
      tags: [rooms]
      summary: Create a room (the caller becomes the host)
      description: Requires the `rooms:create` permission. Rate limited per user.
      security: [{ bearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                control_mode: { $ref: "#/components/schemas/ControlMode" }
                chat_enabled: { type: boolean }
      responses:
        "201":
          description: Room created
          content: { application/json: { schema: { $ref: "#/components/schemas/RoomAccess" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/rooms/{room_id}:
    parameters: [{ $ref: "#/components/parameters/RoomId" }]
    get:
      tags: [rooms]
      summary: Room state (members only)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Current room state
          content: { application/json: { schema: { $ref: "#/components/schemas/RoomView" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: Not a member, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/rooms/{room_id}/join:
    parameters: [{ $ref: "#/components/parameters/RoomId" }]
    post:
      tags: [rooms]
      summary: Reserve a seat in a room
      description: Requires `rooms:join`. Open the WebSocket afterwards (within FLICKSYNC_CONNECT_GRACE).
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Joined (idempotent)
          content: { application/json: { schema: { $ref: "#/components/schemas/RoomAccess" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: Room full, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/rooms/{room_id}/leave:
    parameters: [{ $ref: "#/components/parameters/RoomId" }]
    post:
      tags: [rooms]
      summary: Leave a room permanently
      security: [{ bearer: [] }]
      responses:
        "204": { description: Left }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/rooms/{room_id}/ws:
    parameters: [{ $ref: "#/components/parameters/RoomId" }]
    get:
      tags: [rooms]
      summary: WebSocket upgrade (see protocol.md)
      description: |
        Authenticate with `Authorization: Bearer <token>` or `?access_token=<token>`.
        A browser `Origin` header must be listed in FLICKSYNC_CORS_ORIGINS.
        Joins the room implicitly when the user is not yet a member.
      security: [{ bearer: [] }]
      parameters:
        - { name: access_token, in: query, required: false, schema: { type: string }, description: Fallback for clients that cannot set headers }
      responses:
        "101": { description: Switching protocols }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/downloads:
    post:
      tags: [downloads]
      summary: FlickDD, create a download grant
      description: |
        Requires the `downloads:create` permission. Every FlickDD route answers `404 DOWNLOAD_NOT_FOUND`
        while FlickDD is disabled (FLICKDD_ENABLED=false). Guide: `flickdd-integration.md`.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateDownload" } } }
      responses:
        "201":
          description: Grant created. The token is shown once.
          content: { application/json: { schema: { $ref: "#/components/schemas/DownloadGrant" } } }
        "400": { description: "INVALID_PAYLOAD (bad body or item_id, or an empty file)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: "DOWNLOAD_NOT_FOUND (unknown item, or FlickDD disabled)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429":
          description: TOO_MANY_DOWNLOADS (10 per user, 100 per server; checked before the backend is asked) or RATE_LIMITED (more than 30 creations per minute per user, with Retry-After)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds, only for RATE_LIMITED }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
        "502": { description: "BACKEND_UNAVAILABLE (generic message; detail is in the server logs)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "503": { description: "BACKEND_UNAVAILABLE (this backend is not configured)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /api/v1/downloads/{id}:
    parameters: [{ $ref: "#/components/parameters/DownloadId" }, { $ref: "#/components/parameters/DownloadTokenQuery" }]
    get:
      tags: [downloads]
      summary: FlickDD, status of a grant
      security: [{ downloadToken: [] }]
      responses:
        "200":
          description: Status
          content: { application/json: { schema: { $ref: "#/components/schemas/DownloadStatus" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { description: "Unknown, expired, finished or cancelled grant, or wrong token (indistinguishable)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    delete:
      tags: [downloads]
      summary: FlickDD, cancel a grant and free its slot
      security: [{ downloadToken: [] }]
      responses:
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/downloads/{id}/file:
    parameters: [{ $ref: "#/components/parameters/DownloadId" }, { $ref: "#/components/parameters/DownloadTokenQuery" }]
    get:
      tags: [downloads]
      summary: FlickDD, the file bytes (also answers HEAD)
      description: |
        Throttled to 10 MiB/s per download by default. A valid `Range` is clamped to the file and truncated to
        `max_range_bytes`; `If-Range` must equal the grant ETag or the whole file is served with `200`. A new
        request on a grant preempts its running stream. A body shorter than `Content-Length` is normal: resume.
      security: [{ downloadToken: [] }]
      parameters:
        - { name: Range, in: header, required: false, schema: { type: string, example: "bytes=0-8388607" } }
        - { name: If-Range, in: header, required: false, schema: { type: string }, description: The ETag from the create response }
      responses:
        "200":
          description: Whole file (no Range, or If-Range did not match)
          headers: { Content-Length: { $ref: "#/components/headers/ContentLength" }, Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }, ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        "206":
          description: Requested range
          headers: { Content-Length: { $ref: "#/components/headers/ContentLength" }, Content-Range: { $ref: "#/components/headers/ContentRange" }, Accept-Ranges: { $ref: "#/components/headers/AcceptRanges" }, ETag: { $ref: "#/components/headers/ETag" } }
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: SOURCE_CHANGED (the file changed on the media server), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "416":
          description: RANGE_NOT_SATISFIABLE
          headers:
            Content-Range: { schema: { type: string, example: "bytes */4831838208" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
        "429":
          description: RATE_LIMITED (120 requests per minute per grant, with Retry-After) or QUOTA_EXCEEDED
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds, only for RATE_LIMITED }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
        "502": { description: BACKEND_UNAVAILABLE, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "503": { description: BACKEND_UNAVAILABLE (backend not configured), content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    downloadToken: { type: http, scheme: bearer, description: "Download token of a grant (Authorization: Bearer, or ?token=; the header wins)" }
    metricsToken: { type: http, scheme: bearer }
  parameters:
    RoomId:
      name: room_id
      in: path
      required: true
      description: 12-character room id or its hyphenated share code (case-insensitive)
      schema: { type: string, example: MR82A9Z8VBJQ }
    DownloadId:
      name: id
      in: path
      required: true
      description: The `download_id` of a grant
      schema: { type: string }
    DownloadTokenQuery:
      name: token
      in: query
      required: false
      description: Download token, for clients that cannot set headers (OS background downloaders). Authorization wins when both are sent.
      schema: { type: string }
  headers:
    ContentLength: { schema: { type: integer, format: int64 }, description: Bytes in this response }
    ContentRange: { schema: { type: string, example: "bytes 0-8388607/4831838208" }, description: 206 only }
    AcceptRanges: { schema: { type: string, example: bytes } }
    ETag: { schema: { type: string }, description: Strong validator of the grant }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: ROOM_NOT_FOUND }
            message: { type: string }
    ControlMode: { type: string, enum: [everyone, host_only] }
    RoomAccess:
      type: object
      properties:
        room_id: { type: string }
        share_code: { type: string, example: MR82-A9Z8-VBJQ }
        participant_id: { type: string }
        host_id: { type: string }
        ws_path: { type: string, example: /api/v1/rooms/MR82A9Z8VBJQ/ws }
        room: { $ref: "#/components/schemas/RoomView" }
    PlaybackSnapshot:
      type: object
      properties:
        state: { type: string, enum: [playing, paused] }
        position: { type: number, description: Seconds at server_time }
        rate: { type: number }
        server_time: { type: integer, format: int64, description: Server wall clock, ms since epoch }
        sequence: { type: integer, format: int64 }
    MediaRef:
      type: object
      required: [provider, server_id, media_id, media_type]
      properties:
        provider: { type: string, enum: [jellyfin, plex] }
        server_id: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
        media_id: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
        media_type: { type: string, enum: [movie, episode] }
        season_id: { type: string }
        episode_id: { type: string }
        title: { type: string }
        duration_secs: { type: number }
    Participant:
      type: object
      properties:
        participant_id: { type: string }
        display_name: { type: string }
        presence: { type: string, enum: [connected, reconnecting, disconnected] }
        is_host: { type: boolean }
        joined_at: { type: integer, format: int64 }
    RoomView:
      type: object
      properties:
        room_id: { type: string }
        state: { type: string, enum: [waiting, media_selected, playing, paused, empty, closed] }
        host_id: { type: string }
        control_mode: { $ref: "#/components/schemas/ControlMode" }
        chat_enabled: { type: boolean }
        max_participants: { type: integer }
        participants: { type: array, items: { $ref: "#/components/schemas/Participant" } }
        media: { nullable: true, allOf: [{ $ref: "#/components/schemas/MediaRef" }] }
        playback: { $ref: "#/components/schemas/PlaybackSnapshot" }
        created_at: { type: integer, format: int64 }
    CreateDownload:
      type: object
      required: [backend, item_id]
      properties:
        backend: { type: string, enum: [jellyfin, plex] }
        item_id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        title: { type: string, maxLength: 200, description: Label for the operator panel }
        kind: { type: string, enum: [movie, episode] }
    DownloadGrant:
      type: object
      properties:
        url: { type: string, example: /api/v1/downloads/Qm9v/file, description: Relative to the server address }
        download_id: { type: string }
        token: { type: string, description: Download token, shown once }
        size: { type: integer, format: int64 }
        filename: { type: string }
        mime: { type: string, example: video/x-matroska }
        etag: { type: string, description: Strong validator, quoted; use it in If-Range }
        chunk_bytes: { type: integer, format: int64, description: Segment size to request }
        max_range_bytes: { type: integer, format: int64, description: Most bytes returned for one ranged request }
        rate_limit_bps: { type: integer, format: int64 }
        expires_at: { type: integer, format: int64, description: ms since epoch; idle TTL and absolute age combined }
    DownloadStatus:
      type: object
      properties:
        download_id: { type: string }
        size: { type: integer, format: int64 }
        covered: { type: integer, format: int64, description: Distinct bytes handed over so far (diagnostic; resume from your own offset) }
        etag: { type: string }
        expires_at: { type: integer, format: int64 }
